name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.25)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve and validate release version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $v="${{ inputs.version }}" } else { $v="${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $v" }
          npm version $v --no-git-tag-version
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Test
        run: npm run test:run
      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_WEBHOOK_URL: ${{ secrets.VITE_WEBHOOK_URL }}
        run: npm run build
      - name: Build Windows installers
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_WEBHOOK_URL: ${{ secrets.VITE_WEBHOOK_URL }}
        run: npx electron-builder --win --publish=never
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VCHome Hospital ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ steps.ver.outputs.tag }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30
